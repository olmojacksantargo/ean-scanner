<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAN Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --border: rgba(0,0,0,0.1);
  --text: #1a1a1a; --muted: #6b6b6b;
  --green: #1D9E75; --green-light: #E1F5EE;
  --red: #E24B4A; --red-light: #FCEBEB;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --surface: #242422; --border: rgba(255,255,255,0.1);
    --text: #f0ede6; --muted: #9a9990;
    --green-light: #04342C; --red-light: #501313; --amber-light: #412402;
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
header {
  background: var(--surface); border-bottom: 0.5px solid var(--border);
  padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 17px; font-weight: 600; }
header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.section { padding: 16px 16px 0; }
.label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

.card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.card-row {
  display: flex; align-items: center;
  padding: 13px 16px; gap: 12px;
  border-bottom: 0.5px solid var(--border);
}
.card-row:last-child { border-bottom: none; }
.card-row label { font-size: 14px; color: var(--muted); flex-shrink: 0; width: 80px; }
.card-row input {
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 14px; color: var(--text); font-family: inherit;
  -webkit-appearance: none;
}

/* Camera — taller for better close-up framing */
#cam-wrapper {
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  aspect-ratio: 3/4;
  position: relative;
}
#video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
#scan-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.scan-frame {
  width: 82%; height: 28%;
  position: relative;
  transition: border-color 0.2s;
}
.scan-frame::before, .scan-frame::after,
.scan-frame span::before, .scan-frame span::after {
  content: ''; position: absolute;
  width: 30px; height: 30px;
  border-color: #fff; border-style: solid;
  transition: border-color 0.2s;
}
.scan-frame::before  { top: 0; left: 0;  border-width: 3px 0 0 3px; }
.scan-frame::after   { top: 0; right: 0; border-width: 3px 3px 0 0; }
.scan-frame span::before { bottom: 0; left: 0;  border-width: 0 0 3px 3px; }
.scan-frame span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.scan-frame.hit::before, .scan-frame.hit::after,
.scan-frame.hit span::before, .scan-frame.hit span::after {
  border-color: var(--green);
}
.scan-line {
  position: absolute; left: 8px; right: 8px;
  height: 2px;
  background: rgba(29,158,117,0.9);
  box-shadow: 0 0 8px rgba(29,158,117,0.6);
  animation: scanline 1.4s ease-in-out infinite;
}
@keyframes scanline { 0%,100% { top: 5%; } 50% { top: 95%; } }

.cam-controls {
  position: absolute; top: 8px; right: 8px;
  display: flex; gap: 6px; z-index: 3;
}
.cam-btn {
  background: rgba(0,0,0,0.55); color: #fff;
  border: none; padding: 8px 12px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
}
.cam-btn.active { background: var(--amber); }

#zoom-controls {
  position: absolute; bottom: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 3;
}
.zoom-btn {
  background: rgba(0,0,0,0.55); color: #fff;
  border: none; padding: 8px 14px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
  min-width: 48px;
}
.zoom-btn.active { background: #fff; color: #000; }

#flash-overlay {
  position: absolute; inset: 0;
  background: var(--green);
  opacity: 0; pointer-events: none; z-index: 1;
  transition: opacity 0.2s;
}
#flash-overlay.flash { opacity: 0.4; }

.btn {
  width: 100%; padding: 15px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 600;
  cursor: pointer; transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: 0.75; }
.btn-primary   { background: var(--green); color: #fff; }
.btn-secondary { background: var(--surface); border: 0.5px solid var(--border); color: var(--text); }

.result-card {
  border-radius: var(--radius);
  padding: 14px 16px;
  display: none;
}
.result-card.success { background: var(--green-light); border: 0.5px solid var(--green); }
.result-card.error   { background: var(--red-light); border: 0.5px solid var(--red); }
.result-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.result-card.success .result-title { color: var(--green); }
.result-card.error   .result-title { color: var(--red); }
.result-detail { font-size: 13px; color: var(--text); line-height: 1.6; }
.result-badge {
  display: inline-block;
  background: rgba(29,158,117,0.15); color: var(--green);
  border-radius: 6px; padding: 2px 8px;
  font-size: 12px; font-weight: 600;
  margin-right: 4px;
}

.counter {
  background: var(--amber-light);
  border: 0.5px solid var(--amber);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: none;
  justify-content: space-between;
  align-items: center;
}
.counter-num   { font-size: 28px; font-weight: 700; color: var(--amber); }
.counter-label { font-size: 12px; color: var(--muted); }

/* Scan log table */
.log-row {
  display: grid;
  grid-template-columns: 56px 1fr 24px;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 0.5px solid var(--border);
  font-size: 13px;
}
.log-row:last-child { border-bottom: none; }
.log-time {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: pre-line;
  line-height: 1.3;
}
.log-body { min-width: 0; }
.log-desc {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.log-ean {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.log-status {
  font-size: 16px;
  text-align: center;
  line-height: 1;
}
.log-status.saved    { color: var(--green); }
.log-status.notfound { color: var(--red); }
.log-status.error    { color: var(--amber); }

.log-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.log-actions {
  display: flex; gap: 8px;
}
.log-action-btn {
  background: none; border: none;
  color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.06em;
  font-weight: 600; cursor: pointer; padding: 4px 6px;
  -webkit-tap-highlight-color: transparent;
}
.log-action-btn:active { opacity: 0.5; }
.log-empty {
  padding: 24px 16px; text-align: center;
  color: var(--muted); font-size: 13px;
}

.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#scanner-view { display: none; }
.spacer    { height: 16px; }
.spacer-sm { height: 10px; }
.pb        { padding-bottom: 48px; }

.cam-status {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  padding: 12px 0 0;
}
.debug {
  font-size: 10px; color: var(--muted);
  text-align: center; padding-top: 4px;
  font-family: ui-monospace, monospace;
}
</style>
</head>
<body>

<!-- SETUP VIEW -->
<div id="setup-view">
  <header>
    <h1>📦 EAN Scanner</h1>
    <p>Einmalig API Key eingeben</p>
  </header>
  <div class="section">
    <div class="spacer"></div>
    <div class="label">Airtable API Key</div>
    <div class="card">
      <div class="card-row">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="pat..." autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="spacer-sm"></div>
    <p style="font-size:12px;color:var(--muted);padding:0 4px">
      Airtable → Account → Developer Hub. Wird lokal gespeichert, nur auf diesem Gerät.
    </p>
  </div>
  <div class="section"><div class="spacer"></div>
    <button class="btn btn-primary" onclick="startApp()">Los geht's →</button>
  </div>
</div>

<!-- SCANNER VIEW -->
<div id="scanner-view">
  <header>
    <h1>📦 EAN Scanner</h1>
    <p id="header-status">Kamera wird gestartet…</p>
  </header>

  <div class="section">
    <div class="spacer"></div>
    <div id="cam-wrapper">
      <video id="video" playsinline muted autoplay></video>
      <div id="flash-overlay"></div>
      <div id="scan-overlay">
        <div class="scan-frame" id="scan-frame"><span></span><div class="scan-line"></div></div>
      </div>
      <div class="cam-controls">
        <button class="cam-btn" id="torch-btn" onclick="toggleTorch()" style="display:none">⚡</button>
      </div>
      <div id="zoom-controls" style="display:none">
        <button class="zoom-btn" data-zoom="1" onclick="setZoom(1)">1×</button>
        <button class="zoom-btn active" data-zoom="2" onclick="setZoom(2)">2×</button>
        <button class="zoom-btn" data-zoom="3" onclick="setZoom(3)">3×</button>
      </div>
    </div>
    <p class="cam-status" id="cam-status">Barcode in den Rahmen halten</p>
    <p class="debug" id="debug-info"></p>
  </div>

  <!-- Ergebnis -->
  <div class="section"><div class="spacer"></div>
    <div class="result-card" id="result-card">
      <div class="result-title" id="result-title"></div>
      <div class="result-detail" id="result-detail"></div>
    </div>
  </div>

  <!-- Speichern -->
  <div class="section" id="save-section" style="display:none">
    <div class="spacer"></div>
    <button class="btn btn-primary" id="save-btn" onclick="saveRecord()">✓ In Airtable speichern</button>
    <div class="spacer-sm"></div>
    <button class="btn btn-secondary" onclick="cancelSave()">Abbrechen</button>
  </div>

  <!-- Manuell -->
  <div class="section"><div class="spacer"></div>
    <div class="label">Manuell eingeben</div>
    <div class="card">
      <div class="card-row">
        <label>EAN</label>
        <input type="text" id="ean-input" placeholder="4001234567890" inputmode="numeric"
          onkeydown="if(event.key==='Enter') manualLookup()">
      </div>
    </div>
    <div class="spacer-sm"></div>
    <button class="btn btn-secondary" onclick="manualLookup()">EAN suchen</button>
  </div>

  <!-- Counter -->
  <div class="section"><div class="spacer"></div>
    <div class="counter" id="counter">
      <div>
        <div class="counter-num" id="counter-num">0</div>
        <div class="counter-label">Gespeichert</div>
      </div>
      <div style="text-align:right">
        <div class="counter-num" id="counter-err" style="color:var(--red)">0</div>
        <div class="counter-label">Nicht gefunden</div>
      </div>
    </div>
  </div>

  <!-- Scan log -->
  <div class="section">
    <div class="spacer"></div>
    <div class="log-header">
      <div class="label" style="margin-bottom:0">Scan-Log <span id="log-count" style="opacity:0.7"></span></div>
      <div class="log-actions">
        <button class="log-action-btn" onclick="exportLogCSV()">Export</button>
        <button class="log-action-btn" onclick="clearLog()">Leeren</button>
      </div>
    </div>
    <div class="card" id="log-list">
      <div class="log-empty">Noch keine Scans</div>
    </div>
  </div>

  <div class="section pb"><div class="spacer"></div>
    <button class="btn btn-secondary" onclick="resetApp()">⚙ API Key ändern</button>
  </div>
</div>

<script>
// ----- Airtable config -----
const BASE_ID = 'appCrbJojuKd2ifEp';
const EAN_TBL = 'tblQQXW4WP1mXfapz';
const INV_TBL = 'tblQQ91QHguUVv1CH';

const EAN_FLD   = 'fldKzKwU451IfDWtI';
const EAN_SKU   = 'fldPlpOKlUR8gVB3A';
const EAN_COLOR = 'fldF8xpeY1UNvpmdX';
const EAN_SIZE  = 'fldq9f1VbknXtgjj1';
const EAN_LOT   = 'fldFge5GhoXeYWgCj';
const EAN_DESC  = 'fldBdHSHCdlRtcQNf';

const INV_EAN_BC = 'fldq9WPR8VwRU1p8Y';
const INV_LINK   = 'fldP8NRGf9YdFidSU';
const INV_DATUM  = 'fldS7qcrpUwURvXN5';

// ----- State -----
let apiKey = '';
let matchedRecordId = null;
let matchedEAN = null;
let matchedDesc = '';
let scanned = 0;
let notFound = 0;
let scanLog = [];   // persistent: { ts, ean, desc, status }

let videoStream = null;
let videoTrack = null;
let scanLoop = null;
let zxingReader = null;
let nativeDetector = null;
let useNative = false;
let scanCanvas = null;
let scanCtx = null;
let scanAttempts = 0;
let scanHits = 0;
let lastDecoderError = '';

let torchOn = false;
let currentZoom = 1;
let zoomCaps = null;
let scanLocked = false;
let lastScannedCode = null;
let lastScannedAt = 0;
let debugInterval = null;

const LOG_KEY = 'ean_scan_log_v1';

// ----- Init -----
window.addEventListener('DOMContentLoaded', () => {
  loadLog();
  renderLog();
  const saved = localStorage.getItem('airtable_api_key');
  if (saved) { apiKey = saved; showScannerView(); }
});

function startApp() {
  apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { alert('Bitte Airtable API Key eingeben.'); return; }
  localStorage.setItem('airtable_api_key', apiKey);
  showScannerView();
}

function showScannerView() {
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('scanner-view').style.display = 'block';
  startCamera();
}

function resetApp() {
  stopCamera();
  localStorage.removeItem('airtable_api_key');
  apiKey = '';
  document.getElementById('scanner-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('api-key').value = '';
}

// ----- Camera + scanner setup -----
async function startCamera() {
  setStatus('Kamera wird gestartet…');

  const video = document.getElementById('video');

  // Request the highest-resolution back camera available
  const constraints = {
    audio: false,
    video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30 },
    },
  };

  try {
    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    // Fallback to any camera
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e2) {
      setStatus('Kein Kamerazugriff');
      document.getElementById('cam-status').textContent = 'Bitte Kamera erlauben: ' + (e2.message || e2);
      return;
    }
  }

  video.srcObject = videoStream;
  try { await video.play(); } catch (e) {}

  videoTrack = videoStream.getVideoTracks()[0];
  await applyOptimalCameraSettings();
  setupZoomUI();
  setupTorchUI();

  // Decide decoder
  if ('BarcodeDetector' in window) {
    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
      const supported = wanted.filter(f => formats.includes(f));
      if (supported.length) {
        nativeDetector = new BarcodeDetector({ formats: supported });
        useNative = true;
      }
    } catch (e) { useNative = false; }
  }

  if (!useNative) {
    // ZXing fallback — use core MultiFormatReader (synchronous, no browser wrapper)
    const ZXing = window.ZXing;
    if (!ZXing || !ZXing.MultiFormatReader) {
      setStatus('Scanner-Library fehlt');
      document.getElementById('cam-status').textContent = 'ZXing nicht geladen – Seite neu laden';
      return;
    }
    const hints = new Map();
    const fmt = [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,  ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF,
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, fmt);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingReader = new ZXing.MultiFormatReader();
    zxingReader.setHints(hints);
  }

  startScanLoop();
  showDebug();
  setStatus('Bereit zum Scannen');
}

async function applyOptimalCameraSettings() {
  if (!videoTrack || !videoTrack.getCapabilities) return;
  const caps = videoTrack.getCapabilities();
  const advanced = [];

  if (caps.focusMode?.includes('continuous'))        advanced.push({ focusMode: 'continuous' });
  if (caps.exposureMode?.includes('continuous'))     advanced.push({ exposureMode: 'continuous' });
  if (caps.whiteBalanceMode?.includes('continuous')) advanced.push({ whiteBalanceMode: 'continuous' });

  // 2× digital zoom by default → barcodes from 5–15cm distance get more pixels
  if (caps.zoom) {
    zoomCaps = caps.zoom;
    const target = Math.min(2, caps.zoom.max || 1);
    currentZoom = target;
    advanced.push({ zoom: target });
  }

  if (advanced.length) {
    try { await videoTrack.applyConstraints({ advanced }); } catch (e) {}
  }
}

function setupZoomUI() {
  if (!zoomCaps) return;
  const ctrls = document.getElementById('zoom-controls');
  ctrls.style.display = 'flex';
  ctrls.querySelectorAll('.zoom-btn').forEach(btn => {
    const z = parseFloat(btn.dataset.zoom);
    if (z > (zoomCaps.max || 1)) btn.style.display = 'none';
    btn.classList.toggle('active', z === currentZoom);
  });
}

async function setZoom(z) {
  if (!videoTrack || !zoomCaps) return;
  const target = Math.max(zoomCaps.min || 1, Math.min(z, zoomCaps.max || 1));
  try {
    await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
    currentZoom = target;
    document.querySelectorAll('.zoom-btn').forEach(b => {
      b.classList.toggle('active', parseFloat(b.dataset.zoom) === z);
    });
  } catch (e) {}
}

function setupTorchUI() {
  if (!videoTrack || !videoTrack.getCapabilities) return;
  const caps = videoTrack.getCapabilities();
  if (caps.torch) document.getElementById('torch-btn').style.display = 'block';
}

async function toggleTorch() {
  if (!videoTrack) return;
  try {
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('torch-btn').classList.toggle('active', torchOn);
  } catch (e) { torchOn = false; }
}

function showDebug() {
  const s = videoTrack?.getSettings ? videoTrack.getSettings() : {};
  const decoder = useNative ? 'native' : 'zxing';
  const err = lastDecoderError ? ' · ⚠ ' + lastDecoderError : '';
  document.getElementById('debug-info').textContent =
    `${decoder} · ${s.width || '?'}×${s.height || '?'} · zoom ${currentZoom}× · ${scanAttempts} Versuche · ${scanHits} Treffer${err}`;
}

// ----- Continuous scan loop (canvas-based, no concurrent decoders) -----
function initScanCanvas() {
  if (scanCanvas) return;
  scanCanvas = document.createElement('canvas');
  scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
}

function captureFrame() {
  const video = document.getElementById('video');
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  if (scanCanvas.width !== vw || scanCanvas.height !== vh) {
    scanCanvas.width = vw;
    scanCanvas.height = vh;
  }
  scanCtx.drawImage(video, 0, 0, vw, vh);
  return scanCanvas;
}

function startScanLoop() {
  stopScanLoop();
  initScanCanvas();
  scanLoop = setInterval(useNative ? scanOnceNative : scanOnceZXing, 70);
  if (!debugInterval) debugInterval = setInterval(showDebug, 500);
}

function stopScanLoop() {
  if (scanLoop)      { clearInterval(scanLoop);      scanLoop = null; }
  if (debugInterval) { clearInterval(debugInterval); debugInterval = null; }
}

async function scanOnceNative() {
  if (scanLocked) return;
  const canvas = captureFrame();
  if (!canvas) return;
  scanAttempts++;
  try {
    const codes = await nativeDetector.detect(canvas);
    if (codes && codes.length) handleScan(codes[0].rawValue);
  } catch (e) { lastDecoderError = e.message || String(e); }
}

function decodeCanvasWithZxing(canvas) {
  const Z = window.ZXing;
  // HTMLCanvasElementLuminanceSource is the fastest path (no extra copy)
  if (Z?.HTMLCanvasElementLuminanceSource) {
    const ls  = new Z.HTMLCanvasElementLuminanceSource(canvas);
    const bin = new Z.BinaryBitmap(new Z.HybridBinarizer(ls));
    return zxingReader.decode(bin);  // MultiFormatReader.decode(BinaryBitmap) — synchronous
  }
  // Fallback: read pixel data manually via RGBLuminanceSource
  const ctx  = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const ls   = new Z.RGBLuminanceSource(data.data, canvas.width, canvas.height);
  const bin  = new Z.BinaryBitmap(new Z.HybridBinarizer(ls));
  return zxingReader.decode(bin);
}

function scanOnceZXing() {
  if (scanLocked || !zxingReader) return;
  const canvas = captureFrame();
  if (!canvas) return;
  scanAttempts++;
  try {
    const result = decodeCanvasWithZxing(canvas);
    if (result) handleScan(result.getText());
  } catch (e) {
    // NotFoundException = no barcode in frame (expected most of the time)
    const name = e?.name || '';
    if (name && name !== 'NotFoundException' && name !== 'NotFoundException2'
        && name !== 'ChecksumException' && name !== 'FormatException') {
      lastDecoderError = name + ': ' + (e.message || '');
    }
  }
}

function stopCamera() {
  stopScanLoop();
  if (zxingReader) { try { zxingReader.reset(); } catch (e) {} zxingReader = null; }
  if (videoStream) {
    videoStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    videoStream = null;
  }
  videoTrack = null;
  torchOn = false;
  nativeDetector = null;
  useNative = false;
}

// ----- Scan handling -----
function handleScan(code) {
  const now = Date.now();
  if (scanLocked) return;
  if (code === lastScannedCode && (now - lastScannedAt) < 2000) return;

  lastScannedCode = code;
  lastScannedAt = now;
  scanLocked = true;
  scanHits++;

  flashOverlay();
  vibrate(60);

  document.getElementById('ean-input').value = code;
  lookupEAN(code);
}

function flashOverlay() {
  const flash = document.getElementById('flash-overlay');
  const frame = document.getElementById('scan-frame');
  flash.classList.add('flash');
  frame.classList.add('hit');
  setTimeout(() => {
    flash.classList.remove('flash');
    frame.classList.remove('hit');
  }, 250);
}

function manualLookup() {
  const ean = document.getElementById('ean-input').value.trim();
  if (!ean) return;
  scanLocked = true;
  lookupEAN(ean);
}

function cancelSave() {
  matchedRecordId = null; matchedEAN = null;
  document.getElementById('save-section').style.display = 'none';
  showResult(null);
  document.getElementById('ean-input').value = '';
  scanLocked = false;
  lastScannedCode = null;
  setStatus('Bereit zum Scannen');
}

// ----- Airtable lookup -----
async function lookupEAN(ean) {
  setStatus('Suche…');
  showResult(null);
  document.getElementById('save-section').style.display = 'none';
  matchedRecordId = null; matchedEAN = null;

  try {
    const formula = encodeURIComponent(`{EAN}="${ean}"`);
    const fields  = [EAN_FLD, EAN_SKU, EAN_COLOR, EAN_SIZE, EAN_LOT, EAN_DESC]
                      .map(f => `fields[]=${f}`).join('&');
    const url = `https://api.airtable.com/v0/${BASE_ID}/${EAN_TBL}?filterByFormula=${formula}&${fields}&maxRecords=1`;

    const res = await fetch(url, { headers: { Authorization: `Bearer ${apiKey}` } });
    if (!res.ok) {
      if (res.status === 401) {
        throw new Error('API Key ungültig – bitte unter ⚙ neu eingeben');
      }
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API-Fehler ${res.status}`);
    }
    const data = await res.json();

    if (!data.records || data.records.length === 0) {
      notFound++; updateCounter();
      addLogEntry({ ean, desc: '(nicht in Airtable)', status: 'notfound' });
      showResult({ ok: false, message: `EAN "${ean}" nicht gefunden.` });
      setStatus('Nicht gefunden');
      scanLocked = false;
      return;
    }

    const rec = data.records[0];
    const f   = rec.fields;
    const sku   = f[EAN_SKU]   || '–';
    const color = Array.isArray(f[EAN_COLOR]) ? f[EAN_COLOR].join(', ') : (f[EAN_COLOR] || '–');
    const size  = f[EAN_SIZE]  ? (typeof f[EAN_SIZE] === 'object' ? f[EAN_SIZE].name : f[EAN_SIZE]) : '–';
    const lot   = Array.isArray(f[EAN_LOT])   ? f[EAN_LOT].join(', ')  : (f[EAN_LOT]  || '–');
    const desc  = Array.isArray(f[EAN_DESC])  ? f[EAN_DESC].join(', ') : (f[EAN_DESC] || lot);

    matchedRecordId = rec.id;
    matchedEAN      = ean;
    matchedDesc     = desc;

    showResult({ ok: true, sku, color, size, desc });
    document.getElementById('save-section').style.display = 'block';
    setStatus('Gefunden – bitte speichern');

  } catch (e) {
    showResult({ ok: false, message: e.message });
    setStatus('Fehler');
    scanLocked = false;
  }
}

function showResult(data) {
  const card   = document.getElementById('result-card');
  const title  = document.getElementById('result-title');
  const detail = document.getElementById('result-detail');
  if (!data) { card.style.display = 'none'; card.className = 'result-card'; return; }
  card.style.display = 'block';
  if (!data.ok) {
    card.className = 'result-card error';
    title.textContent  = '❌ Nicht gefunden';
    detail.textContent = data.message;
  } else {
    card.className = 'result-card success';
    title.textContent = data.desc;
    detail.innerHTML  =
      `<span class="result-badge">${data.size}</span>` +
      `<span class="result-badge">${data.color}</span>` +
      `<span style="color:var(--muted)">SKU: ${data.sku}</span>`;
  }
}

// ----- Airtable save -----
async function saveRecord() {
  if (!matchedRecordId) return;
  const recId = String(matchedRecordId);
  if (!recId.startsWith('rec')) {
    alert('Ungültige Record ID: ' + recId);
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>Speichern…';
  btn.disabled  = true;

  const today = new Date().toISOString().split('T')[0];

  try {
    const body = {
      fields: {
        [INV_EAN_BC]:  { text: String(matchedEAN) },
        [INV_LINK]:    [recId],
        [INV_DATUM]:   today,
      }
    };
    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${INV_TBL}`, {
      method:  'POST',
      headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `Speicherfehler ${res.status}`);
    }

    scanned++;
    updateCounter();
    addLogEntry({ ean: matchedEAN, desc: matchedDesc, status: 'saved' });
    vibrate([50, 30, 50]);

    document.getElementById('save-section').style.display = 'none';
    document.getElementById('ean-input').value = '';
    showResult(null);
    setStatus(`✓ Gespeichert (${scanned} gesamt)`);
    setTimeout(() => setStatus('Bereit zum Scannen'), 1500);

    matchedRecordId = null; matchedEAN = null;

  } catch (e) {
    alert('Fehler beim Speichern: ' + e.message);
  }

  btn.innerHTML = '✓ In Airtable speichern';
  btn.disabled  = false;
  scanLocked     = false;
  lastScannedCode = null;
  lastScannedAt   = 0;
}

// ----- Scan log (persistent) -----
function loadLog() {
  try {
    const raw = localStorage.getItem(LOG_KEY);
    scanLog = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(scanLog)) scanLog = [];
  } catch (e) { scanLog = []; }
}

function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(scanLog)); } catch (e) {}
}

function addLogEntry({ ean, desc, status }) {
  scanLog.unshift({ ts: Date.now(), ean: String(ean), desc: String(desc || ''), status });
  if (scanLog.length > 500) scanLog.length = 500;  // sane cap
  saveLog();
  renderLog();
}

function deleteLogEntry(ts) {
  scanLog = scanLog.filter(e => e.ts !== ts);
  saveLog();
  renderLog();
}

function clearLog() {
  if (!scanLog.length) return;
  if (!confirm(`Alle ${scanLog.length} Einträge im Log löschen?`)) return;
  scanLog = [];
  saveLog();
  renderLog();
}

function renderLog() {
  const list = document.getElementById('log-list');
  const count = document.getElementById('log-count');
  if (!list) return;
  count.textContent = scanLog.length ? `(${scanLog.length})` : '';
  if (!scanLog.length) {
    list.innerHTML = '<div class="log-empty">Noch keine Scans</div>';
    return;
  }
  list.innerHTML = scanLog.map(e => {
    const icon = e.status === 'saved' ? '✓' : e.status === 'notfound' ? '✗' : '!';
    const time = formatTime(e.ts);
    return `<div class="log-row" onclick="onLogTap(${e.ts})">
      <div class="log-time">${time}</div>
      <div class="log-body">
        <div class="log-desc">${escapeHtml(e.desc) || '–'}</div>
        <div class="log-ean">${escapeHtml(e.ean)}</div>
      </div>
      <div class="log-status ${e.status}">${icon}</div>
    </div>`;
  }).join('');
}

function onLogTap(ts) {
  const e = scanLog.find(x => x.ts === ts);
  if (!e) return;
  if (confirm(`${e.desc || e.ean}\n${e.ean}\n${new Date(e.ts).toLocaleString('de-DE')}\n\nEintrag löschen?`)) {
    deleteLogEntry(ts);
  }
}

function formatTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return `${hh}:${mm}`;
  const dd = String(d.getDate()).padStart(2, '0');
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}.${mo}\n${hh}:${mm}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function exportLogCSV() {
  if (!scanLog.length) { alert('Log ist leer.'); return; }
  const rows = [['Datum', 'Uhrzeit', 'EAN', 'Beschreibung', 'Status']];
  scanLog.forEach(e => {
    const d = new Date(e.ts);
    const date = d.toLocaleDateString('de-DE');
    const time = d.toLocaleTimeString('de-DE');
    rows.push([date, time, e.ean, e.desc, e.status]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `ean-scan-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function updateCounter() {
  document.getElementById('counter-num').textContent = scanned;
  document.getElementById('counter-err').textContent = notFound;
  document.getElementById('counter').style.display   = 'flex';
}

function setStatus(msg) {
  document.getElementById('header-status').textContent = msg;
}

function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
</script>
