<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAN Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.1);
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --green: #1D9E75;
  --green-light: #E1F5EE;
  --red: #E24B4A;
  --red-light: #FCEBEB;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18;
    --surface: #242422;
    --border: rgba(255,255,255,0.1);
    --text: #f0ede6;
    --muted: #9a9990;
    --green-light: #04342C;
    --red-light: #501313;
    --amber-light: #412402;
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 16px 20px 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { font-size: 17px; font-weight: 600; }
header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.section { padding: 16px 16px 0; }
.label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-row {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  gap: 12px;
  border-bottom: 0.5px solid var(--border);
}
.card-row:last-child { border-bottom: none; }
.card-row label { font-size: 14px; color: var(--muted); flex-shrink: 0; width: 80px; }
.card-row input, .card-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: var(--text);
  font-family: inherit;
  -webkit-appearance: none;
}

/* Camera */
#cam-wrapper {
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  aspect-ratio: 4/3;
  position: relative;
}
#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#scan-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.scan-frame {
  width: 78%;
  height: 32%;
  position: relative;
  transition: border-color 0.2s;
}
.scan-frame::before, .scan-frame::after,
.scan-frame span::before, .scan-frame span::after {
  content: '';
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  transition: border-color 0.2s;
}
.scan-frame::before  { top: 0;    left: 0;  border-width: 3px 0 0 3px; }
.scan-frame::after   { top: 0;    right: 0; border-width: 3px 3px 0 0; }
.scan-frame span::before { bottom: 0; left: 0;  border-width: 0 0 3px 3px; }
.scan-frame span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.scan-frame.hit::before, .scan-frame.hit::after,
.scan-frame.hit span::before, .scan-frame.hit span::after {
  border-color: var(--green);
}
.scan-line {
  position: absolute;
  left: 8px; right: 8px;
  height: 2px;
  background: rgba(29,158,117,0.9);
  box-shadow: 0 0 8px rgba(29,158,117,0.6);
  animation: scanline 1.8s ease-in-out infinite;
}
@keyframes scanline {
  0%, 100% { top: 8%; }
  50%       { top: 92%; }
}

.cam-controls {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 6px;
  z-index: 3;
}
.cam-btn {
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
}
.cam-btn.active { background: var(--amber); }

#flash-overlay {
  position: absolute;
  inset: 0;
  background: var(--green);
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  transition: opacity 0.2s;
}
#flash-overlay.flash { opacity: 0.4; }

.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: 0.75; }
.btn-primary   { background: var(--green);   color: #fff; }
.btn-secondary { background: var(--surface); border: 0.5px solid var(--border); color: var(--text); }

.result-card {
  border-radius: var(--radius);
  padding: 14px 16px;
  display: none;
}
.result-card.success { background: var(--green-light); border: 0.5px solid var(--green); }
.result-card.error   { background: var(--red-light);   border: 0.5px solid var(--red); }
.result-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.result-card.success .result-title { color: var(--green); }
.result-card.error   .result-title { color: var(--red); }
.result-detail { font-size: 13px; color: var(--text); line-height: 1.6; }
.result-badge {
  display: inline-block;
  background: rgba(29,158,117,0.15);
  color: var(--green);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 600;
  margin-right: 4px;
}

.counter {
  background: var(--amber-light);
  border: 0.5px solid var(--amber);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: none;
  justify-content: space-between;
  align-items: center;
}
.counter-num   { font-size: 28px; font-weight: 700; color: var(--amber); }
.counter-label { font-size: 12px; color: var(--muted); }

.history-item { padding: 10px 16px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.history-item:last-child { border-bottom: none; }
.history-sku  { font-weight: 600; }
.history-meta { color: var(--muted); margin-top: 2px; }

.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#scanner-view { display: none; }
.spacer    { height: 16px; }
.spacer-sm { height: 10px; }
.pb        { padding-bottom: 48px; }

.cam-status {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  padding: 12px 0 0;
}
</style>
</head>
<body>

<!-- SETUP VIEW -->
<div id="setup-view">
  <header>
    <h1>📦 EAN Scanner</h1>
    <p>Einmalig API Key eingeben</p>
  </header>
  <div class="section">
    <div class="spacer"></div>
    <div class="label">Airtable API Key</div>
    <div class="card">
      <div class="card-row">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="pat..." autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="spacer-sm"></div>
    <p style="font-size:12px;color:var(--muted);padding:0 4px">
      Airtable → Account → Developer Hub. Wird lokal gespeichert, nur auf diesem Gerät.
    </p>
  </div>
  <div class="section"><div class="spacer"></div>
    <button class="btn btn-primary" onclick="startApp()">Los geht's →</button>
  </div>
</div>

<!-- SCANNER VIEW -->
<div id="scanner-view">
  <header>
    <h1>📦 EAN Scanner</h1>
    <p id="header-status">Kamera wird gestartet…</p>
  </header>

  <div class="section">
    <div class="spacer"></div>
    <div id="cam-wrapper">
      <video id="video" playsinline muted autoplay></video>
      <div id="flash-overlay"></div>
      <div id="scan-overlay">
        <div class="scan-frame" id="scan-frame"><span></span><div class="scan-line"></div></div>
      </div>
      <div class="cam-controls">
        <button class="cam-btn" id="torch-btn" onclick="toggleTorch()" style="display:none">⚡</button>
      </div>
    </div>
    <p class="cam-status" id="cam-status">Barcode in den Rahmen halten</p>
  </div>

  <!-- Ergebnis -->
  <div class="section"><div class="spacer"></div>
    <div class="result-card" id="result-card">
      <div class="result-title" id="result-title"></div>
      <div class="result-detail" id="result-detail"></div>
    </div>
  </div>

  <!-- Speichern -->
  <div class="section" id="save-section" style="display:none">
    <div class="spacer"></div>
    <button class="btn btn-primary" id="save-btn" onclick="saveRecord()">✓ In Airtable speichern</button>
    <div class="spacer-sm"></div>
    <button class="btn btn-secondary" onclick="cancelSave()">Abbrechen</button>
  </div>

  <!-- Manuell -->
  <div class="section"><div class="spacer"></div>
    <div class="label">Manuell eingeben</div>
    <div class="card">
      <div class="card-row">
        <label>EAN</label>
        <input type="text" id="ean-input" placeholder="4001234567890" inputmode="numeric"
          onkeydown="if(event.key==='Enter') manualLookup()">
      </div>
    </div>
    <div class="spacer-sm"></div>
    <button class="btn btn-secondary" onclick="manualLookup()">EAN suchen</button>
  </div>

  <!-- Counter -->
  <div class="section"><div class="spacer"></div>
    <div class="counter" id="counter">
      <div>
        <div class="counter-num" id="counter-num">0</div>
        <div class="counter-label">Gespeichert</div>
      </div>
      <div style="text-align:right">
        <div class="counter-num" id="counter-err" style="color:var(--red)">0</div>
        <div class="counter-label">Nicht gefunden</div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="section" id="history-section" style="display:none">
    <div class="spacer"></div>
    <div class="label">Zuletzt gescannt</div>
    <div class="card" id="history-list"></div>
  </div>

  <div class="section pb"><div class="spacer"></div>
    <button class="btn btn-secondary" onclick="resetApp()">⚙ API Key ändern</button>
  </div>
</div>

<script>
const BASE_ID = 'appCrbJojuKd2ifEp';
const EAN_TBL = 'tblQQXW4WP1mXfapz';
const INV_TBL = 'tblQQ91QHguUVv1CH';

const EAN_FLD   = 'fldKzKwU451IfDWtI';
const EAN_SKU   = 'fldPlpOKlUR8gVB3A';
const EAN_COLOR = 'fldF8xpeY1UNvpmdX';
const EAN_SIZE  = 'fldq9f1VbknXtgjj1';
const EAN_LOT   = 'fldFge5GhoXeYWgCj';
const EAN_DESC  = 'fldBdHSHCdlRtcQNf';

const INV_EAN_BC  = 'fldq9WPR8VwRU1p8Y';
const INV_LINK    = 'fldP8NRGf9YdFidSU';
const INV_DATUM   = 'fldS7qcrpUwURvXN5';

let apiKey = '';
let matchedRecordId = null;
let matchedEAN = null;
let matchedDesc = '';
let scanned = 0;
let notFound = 0;
let scanHistory = [];
let codeReader = null;
let scannerControls = null;
let videoTrack = null;
let torchOn = false;
let scanLocked = false;
let lastScannedCode = null;
let lastScannedAt = 0;

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('airtable_api_key');
  if (saved) {
    apiKey = saved;
    showScannerView();
  }
});

function startApp() {
  apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { alert('Bitte Airtable API Key eingeben.'); return; }
  localStorage.setItem('airtable_api_key', apiKey);
  showScannerView();
}

function showScannerView() {
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('scanner-view').style.display = 'block';
  startCamera();
}

function resetApp() {
  stopCamera();
  localStorage.removeItem('airtable_api_key');
  apiKey = '';
  document.getElementById('scanner-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('api-key').value = '';
}

async function startCamera() {
  setStatus('Kamera wird gestartet…');

  const hints = new Map();
  const ZXing = window.ZXing;
  const ZXingBrowser = window.ZXingBrowser;

  if (!ZXing || !ZXingBrowser) {
    setStatus('Scanner-Library konnte nicht geladen werden');
    return;
  }

  const formats = [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.ITF,
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  codeReader = new ZXingBrowser.BrowserMultiFormatReader(hints, {
    delayBetweenScanAttempts: 80,   // try every 80ms instead of default 500ms
    delayBetweenScanSuccess: 800,
  });

  const constraints = {
    video: {
      facingMode: { ideal: 'environment' },
      width:  { ideal: 1920 },
      height: { ideal: 1080 },
    }
  };

  const video = document.getElementById('video');

  try {
    scannerControls = await codeReader.decodeFromConstraints(
      constraints,
      video,
      (result, err) => {
        if (result) handleScan(result.getText());
      }
    );

    // grab the video track for torch control + continuous focus
    const stream = video.srcObject;
    if (stream) {
      videoTrack = stream.getVideoTracks()[0];
      tryEnableContinuousFocus(videoTrack);
      checkTorchSupport(videoTrack);
    }

    setStatus('Bereit zum Scannen');
  } catch (e) {
    setStatus('Kamera nicht verfügbar');
    document.getElementById('cam-status').textContent =
      'Kamerazugriff verweigert. Bitte in den Browser-Einstellungen erlauben.';
  }
}

async function tryEnableContinuousFocus(track) {
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const advanced = [];
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      advanced.push({ focusMode: 'continuous' });
    }
    if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
      advanced.push({ exposureMode: 'continuous' });
    }
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) {
      advanced.push({ whiteBalanceMode: 'continuous' });
    }
    if (advanced.length) await track.applyConstraints({ advanced });
  } catch (e) { /* ignore */ }
}

function checkTorchSupport(track) {
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch) {
    document.getElementById('torch-btn').style.display = 'block';
  }
}

async function toggleTorch() {
  if (!videoTrack) return;
  try {
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('torch-btn').classList.toggle('active', torchOn);
  } catch (e) {
    torchOn = false;
  }
}

function stopCamera() {
  if (scannerControls) {
    try { scannerControls.stop(); } catch (e) {}
    scannerControls = null;
  }
  if (videoTrack) {
    try { videoTrack.stop(); } catch (e) {}
    videoTrack = null;
  }
  codeReader = null;
  torchOn = false;
}

function handleScan(code) {
  const now = Date.now();
  // ignore same code re-scanned within 2.5s, and any scan while a result is open
  if (scanLocked) return;
  if (code === lastScannedCode && (now - lastScannedAt) < 2500) return;

  lastScannedCode = code;
  lastScannedAt = now;
  scanLocked = true;

  flashOverlay();
  vibrate(50);

  document.getElementById('ean-input').value = code;
  lookupEAN(code);
}

function flashOverlay() {
  const flash = document.getElementById('flash-overlay');
  const frame = document.getElementById('scan-frame');
  flash.classList.add('flash');
  frame.classList.add('hit');
  setTimeout(() => {
    flash.classList.remove('flash');
    frame.classList.remove('hit');
  }, 250);
}

function manualLookup() {
  const ean = document.getElementById('ean-input').value.trim();
  if (!ean) return;
  scanLocked = true;
  lookupEAN(ean);
}

function cancelSave() {
  matchedRecordId = null;
  matchedEAN = null;
  document.getElementById('save-section').style.display = 'none';
  showResult(null);
  document.getElementById('ean-input').value = '';
  scanLocked = false;
  setStatus('Bereit zum Scannen');
}

async function lookupEAN(ean) {
  setStatus('Suche…');
  showResult(null);
  document.getElementById('save-section').style.display = 'none';
  matchedRecordId = null;
  matchedEAN = null;

  try {
    const formula = encodeURIComponent(`{EAN}="${ean}"`);
    const fields  = [EAN_FLD, EAN_SKU, EAN_COLOR, EAN_SIZE, EAN_LOT, EAN_DESC]
                      .map(f => `fields[]=${f}`).join('&');
    const url = `https://api.airtable.com/v0/${BASE_ID}/${EAN_TBL}?filterByFormula=${formula}&${fields}&maxRecords=1`;

    const res = await fetch(url, { headers: { Authorization: `Bearer ${apiKey}` } });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `API-Fehler ${res.status}`);
    }

    const data = await res.json();

    if (!data.records || data.records.length === 0) {
      notFound++;
      updateCounter();
      showResult({ ok: false, message: `EAN "${ean}" nicht gefunden.` });
      setStatus('Nicht gefunden');
      scanLocked = false;
      return;
    }

    const rec = data.records[0];
    const f   = rec.fields;

    const sku   = f[EAN_SKU]   || '–';
    const color = Array.isArray(f[EAN_COLOR]) ? f[EAN_COLOR].join(', ') : (f[EAN_COLOR] || '–');
    const size  = f[EAN_SIZE]  ? (typeof f[EAN_SIZE] === 'object' ? f[EAN_SIZE].name : f[EAN_SIZE]) : '–';
    const lot   = Array.isArray(f[EAN_LOT])   ? f[EAN_LOT].join(', ')  : (f[EAN_LOT]  || '–');
    const desc  = Array.isArray(f[EAN_DESC])  ? f[EAN_DESC].join(', ') : (f[EAN_DESC] || lot);

    matchedRecordId = rec.id;
    matchedEAN      = ean;
    matchedDesc     = desc;

    showResult({ ok: true, sku, color, size, desc });
    document.getElementById('save-section').style.display = 'block';
    setStatus('Gefunden – bitte speichern');

  } catch (e) {
    showResult({ ok: false, message: e.message });
    setStatus('Fehler');
    scanLocked = false;
  }
}

function showResult(data) {
  const card   = document.getElementById('result-card');
  const title  = document.getElementById('result-title');
  const detail = document.getElementById('result-detail');

  if (!data) { card.style.display = 'none'; card.className = 'result-card'; return; }

  card.style.display = 'block';
  if (!data.ok) {
    card.className = 'result-card error';
    title.textContent  = '❌ Nicht gefunden';
    detail.textContent = data.message;
  } else {
    card.className = 'result-card success';
    title.textContent = data.desc;
    detail.innerHTML  =
      `<span class="result-badge">${data.size}</span>` +
      `<span class="result-badge">${data.color}</span>` +
      `<span style="color:var(--muted)">SKU: ${data.sku}</span>`;
  }
}

async function saveRecord() {
  if (!matchedRecordId) return;

  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="spinner"></span>Speichern…';
  btn.disabled  = true;

  const today = new Date().toISOString().split('T')[0];

  try {
    const body = {
      fields: {
        [INV_EAN_BC]:  { text: matchedEAN },
        [INV_LINK]:    [{ id: matchedRecordId }],
        [INV_DATUM]:   today,
      }
    };

    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${INV_TBL}`, {
      method:  'POST',
      headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `Speicherfehler ${res.status}`);
    }

    scanned++;
    updateCounter();
    addHistory(matchedEAN, matchedDesc);
    vibrate([50, 30, 50]);

    document.getElementById('save-section').style.display = 'none';
    document.getElementById('ean-input').value = '';
    showResult(null);
    setStatus(`✓ Gespeichert (${scanned} gesamt)`);
    setTimeout(() => setStatus('Bereit zum Scannen'), 2000);

    matchedRecordId = null;
    matchedEAN      = null;

  } catch (e) {
    alert('Fehler beim Speichern: ' + e.message);
  }

  btn.innerHTML = '✓ In Airtable speichern';
  btn.disabled  = false;
  scanLocked    = false;
}

function addHistory(ean, desc) {
  scanHistory.unshift({ ean, desc });
  if (scanHistory.length > 10) scanHistory.pop();

  document.getElementById('history-list').innerHTML = scanHistory.map(h =>
    `<div class="history-item">
      <div class="history-sku">${h.desc}</div>
      <div class="history-meta">${h.ean}</div>
    </div>`
  ).join('');

  document.getElementById('history-section').style.display = 'block';
}

function updateCounter() {
  document.getElementById('counter-num').textContent = scanned;
  document.getElementById('counter-err').textContent = notFound;
  document.getElementById('counter').style.display   = 'flex';
}

function setStatus(msg) {
  document.getElementById('header-status').textContent = msg;
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}
</script>
</body>
</html>
